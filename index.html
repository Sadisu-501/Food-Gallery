<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raisins Food Gallery</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.png" />
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
    <!-- css style sheet -->
    <link rel="stylesheet" href="style.css" />
    <!-- tailwind css -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- javascript script -->
    <script src="index.js" defer></script>
  </head>
  <body>
    <nav>
      <!-- logo -->
      <div class="logo">
        <img src="images/raisins logo.png" alt="" />
      </div>

      <!-- links -->
      <ul class="links hidden sm:flex md:flex lg:flex">
        <li><a href="#menu">Menu</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <!-- mobile -->
      <ul id="menu-links" class="links hidden">
        <li><a href="#menu">Menu</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

      <ion-icon id="btn" class="text-4xl flex sm:hidden md:hidden lg:hidden" name="menu-outline"></ion-icon>
    </nav>
    <div class="overlay hidden"></div>
    <!-- hero section -->
    <section class="hero font-bold text-center text-gray-600 text-xl sm:text-2xl md:text-3xl lg:text-4xl">
      <div>
        <h1 class="logo">Raisins Food Gallery</h1>
      </div>
      <div class="hero-btn">
        <button id="menu-btn">All</button>
        <button id="menu-btn">Food</button>
        <button id="menu-btn">Cakes</button>
        <button id="menu-btn">Drinks</button>
      </div>
    </section>

    <!-- main content -->
    <main class="shadow-lg">
      <div class="card-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 p-4">
        <!-- cards -->
        <div class="card bg-gray-300 rounded-lg shadow-lg hover:scale-105 transition-transform duration-300">
          <img class="rounded h-[80%]" width="100%" src="images/arabian.jpg" alt="food image" />
          <div class="card-body text-center mt-4">
            <h2 class="card-title font-bold text-gray-600 sm:text-lg md:text-xl">Arabian Rice</h2>
          </div>
        </div>

        <div class="card bg-gray-300 rounded-lg shadow-lg hover:scale-105 transition-transform duration-300">
          <img class="rounded h-[80%]" width="100%" src="images/arabian.jpg" alt="fried" />
          <div class="card-body text-center mt-4">
            <h2 class="card-title font-bold text-gray-600 sm:text-lg md:text-xl">Fried Rice</h2>
          </div>
        </div>

        <div class="card bg-gray-300 rounded-lg shadow-lg hover:scale-105 transition-transform duration-300">
          <img class="rounded h-[80%]" width="100%" src="images/arabian.jpg" alt="jollof" />
          <div class="card-body text-center mt-4">
            <h2 class="card-title font-bold text-gray-600 sm:text-lg md:text-xl">Jollof Rice</h2>
          </div>
        </div>

        <div class="card bg-gray-300 rounded-lg shadow-lg hover:scale-105 transition-transform duration-300">
          <img class="rounded h-[80%]" width="100%" src="images/arabian.jpg" alt="chicken biryani" />
          <div class="card-body text-center mt-4">
            <h2 class="card-title font-bold text-gray-600 sm:text-lg md:text-xl">Chicken Biryani</h2>
          </div>
        </div>

        <div class="card bg-gray-300 rounded-lg shadow-lg hover:scale-105 transition-transform duration-300">
          <img class="rounded h-[80%]" width="100%" src="images/arabian.jpg" alt="chinese rice" />
          <div class="card-body text-center mt-4">
            <h2 class="card-title font-bold text-gray-600 sm:text-lg md:text-xl">Chinese rice</h2>
          </div>
        </div>

        <div class="card bg-gray-300 rounded-lg shadow-lg hover:scale-105 transition-transform duration-300">
          <img class="rounded h-[80%]" width="100%" src="images/arabian.jpg" alt="mandy" />
          <div class="card-body text-center mt-4">
            <h2 class="card-title font-bold text-gray-600 sm:text-lg md:text-xl">Mandy</h2>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
  </body>
</html>
